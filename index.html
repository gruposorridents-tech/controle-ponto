<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Controle de Ponto</title>
<style>
    body{margin:0;font-family:Segoe UI;background:#eef2f7;}
    .header{background:#1e293b;color:white;padding:15px;text-align:center;}
    .container{padding:15px;}
    .top-controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
    input,select{padding:8px;border:1px solid #ccc;border-radius:5px;}
    button{padding:8px 12px;border:none;border-radius:5px;cursor:pointer;background:#2563eb;color:white;}
    .cards{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
    .card{flex:1;background:white;padding:10px;border-radius:6px;text-align:center;border:1px solid #ddd;min-width:100px;}
    .credito{color:#16a34a;}
    .debito{color:#dc2626;}
    table{width:100%;border-collapse:collapse;background:white;}
    th{background:#334155;color:white;padding:8px;}
    td{padding:6px;text-align:center;border-bottom:1px solid #ddd;}
    .hoje{background:#e0f2fe !important;}
    .obs{width:150px;}
    
    /* Responsividade básica para tabela */
    @media (max-width: 768px) {
        .container { overflow-x: auto; }
    }
</style>

<!-- 🔥 FIREBASE PRIMEIRO -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAEq2fa6m9px15IGR6vUPUQ_UnFhkwlPc",
        authDomain: "controle-ponto-1fb12.firebaseapp.com",
        projectId: "controle-ponto-1fb12"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
</script>
</head>
<body>

<div class="header">Sistema de Controle de Ponto</div>

<div class="container">
    <div class="top-controls">
        <input id="empresa" placeholder="Empresa">
        <input id="funcionario" placeholder="Funcionário">
        <select id="mes"></select>
        <select id="ano"></select>
        <input id="carga" placeholder="Horas/dia (ex: 8)" value="8" style="width:130px">
        <button onclick="carregar()">Carregar</button>
        <button onclick="salvar()">Salvar</button>
        <!-- <button onclick="exportarCSV()">Exportar</button> -->
        <button onclick="padrao()">Padrão</button>
        <button onclick="limpar()">Limpar</button>
    </div>

    <div class="cards">
        <div class="card">Trabalhado<br><b id="h">00:00</b></div>
        <div class="card">Crédito<br><b id="c" class="credito">00:00</b></div>
        <div class="card">Débito<br><b id="d" class="debito">00:00</b></div>
        <div class="card">Saldo Mês<br><b id="sm">00:00</b></div>
        <div class="card">Saldo Anterior<br><b id="sa">00:00</b></div>
        <div class="card">Saldo Acum.<br><b id="ac">00:00</b></div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Dia</th>
                <th>Sem</th>
                <th>Tipo</th>
                <th>Entrada</th>
                <th>Saída Almoço</th>
                <th>Volta</th>
                <th>Saída</th>
                <th>Total</th>
                <th>Saldo</th>
                <th>Observação</th>
            </tr>
        </thead>
        <tbody id="tb"></tbody>
    </table>
</div>

<script>
    const diasSemana =["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];

    const mesEl = document.getElementById("mes");
    const anoEl = document.getElementById("ano");
    const empresaEl = document.getElementById("empresa");
    const funcionarioEl = document.getElementById("funcionario");
    const cargaEl = document.getElementById("carga");
    const tb = document.getElementById("tb");

    // Elementos dos Cards
    const elH = document.getElementById("h");
    const elC = document.getElementById("c");
    const elD = document.getElementById("d");
    const elSM = document.getElementById("sm");
    const elSA = document.getElementById("sa");
    const elAC = document.getElementById("ac");

    // Data Atual para auto-selecionar
    const dataAtual = new Date();
    const mesAtual = dataAtual.getMonth() + 1;
    const anoAtual = dataAtual.getFullYear();

    // Preencher Meses (COM CRASE CORRETA)
    for(let m=1; m<=12; m++) {
        const selecionado = (m === mesAtual) ? "selected" : "";
        mesEl.innerHTML += `<option value="${m}" ${selecionado}>${String(m).padStart(2,'0')}</option>`;
    }
    // Preencher Anos (COM CRASE CORRETA)
    for(let a=2020; a<=2030; a++) {
        const selecionado = (a === anoAtual) ? "selected" : "";
        anoEl.innerHTML += `<option value="${a}" ${selecionado}>${a}</option>`;
    }

    // Chave para salvar no banco/localstorage
    function getKey(mesVal, anoVal) {
        const emp = empresaEl.value.trim().toLowerCase() || "empresa";
        const func = funcionarioEl.value.trim().toLowerCase() || "func";
        return `ponto_${emp}_${func}_${anoVal}_${mesVal}`;
    }

    function gerar() {
        const mes = +mesEl.value;
        const ano = +anoEl.value;

        tb.innerHTML = "";
        const dias = new Date(ano, mes, 0).getDate(); // Quantidade de dias no mês

        for(let i=1; i<=dias; i++) {
            const d = new Date(ano, mes-1, i);
            const tr = document.createElement("tr");

            if(new Date().toDateString() == d.toDateString()) {
                tr.classList.add("hoje");
            }

            tr.innerHTML = `
                <td>${String(i).padStart(2,'0')}/${String(mes).padStart(2,'0')}</td>
                <td>${diasSemana[d.getDay()]}</td>
                <td>
                    <select>
                        <option>Normal</option>
                        <option ${d.getDay() === 0 || d.getDay() === 6 ? 'selected' : ''}>Folga/FDS</option>
                        <option>Feriado</option>
                        <option>Atestado</option>
                        <option>Falta</option>
                    </select>
                </td>
                <td><input type="time"></td>
                <td><input type="time"></td>
                <td><input type="time"></td>
                <td><input type="time"></td>
                <td class="t">00:00</td>
                <td class="s">00:00</td>
                <td><input class="obs" type="text"></td>
            `;
            tb.appendChild(tr);
        }
        calc(); // Recalcula ao gerar
    }

    mesEl.onchange = gerar;
    anoEl.onchange = gerar;
    gerar();

    // 🔥 SALVAR (LOCAL + FIREBASE)
    async function salvar() {
        const key = getKey(mesEl.value, anoEl.value);
        let dados =[];

        document.querySelectorAll("#tb tr").forEach(r => {
            const inputs = r.querySelectorAll("input");
            const select = r.querySelector("select");

            dados.push({
                tipo: select.value,
                entrada: inputs[0].value,
                saidaAlmoco: inputs[1].value,
                volta: inputs[2].value,
                saida: inputs[3].value,
                obs: inputs[4].value
            });
        });

        // backup local
        localStorage.setItem(key, JSON.stringify(dados));

        // firebase
        try {
            await db.collection("pontos").doc(key).set({dados});
            alert("Salvo na nuvem com sucesso! 🚀");
        } catch(e) {
            console.error("Erro no Firebase:", e);
            alert("Erro ao salvar na nuvem (Salvo apenas no computador local). Verifique as regras do Firestore.");
        }
    }

    // 🔥 CARREGAR (FIREBASE + FALLBACK)
    async function carregar() {
        gerar();
        const key = getKey(mesEl.value, anoEl.value);

        try {
            const doc = await db.collection("pontos").doc(key).get();
            if(doc.exists) {
                const dados = doc.data().dados;
                preencherTabela(dados);
                calc();
                return;
            }
        } catch(e) {
            console.error("Erro ao carregar da nuvem:", e);
        }

        // fallback local
        const dados = JSON.parse(localStorage.getItem(key));
        if(dados) {
            preencherTabela(dados);
            calc();
        } else {
            alert("Nenhum dado encontrado para este mês.");
        }
    }

    // 🔥 PREENCHER TABELA
    function preencherTabela(dados) {
        document.querySelectorAll("#tb tr").forEach((r, i) => {
            if(!dados[i]) return;
            const inputs = r.querySelectorAll("input");
            r.querySelector("select").value = dados[i].tipo;
            inputs[0].value = dados[i].entrada;
            inputs[1].value = dados[i].saidaAlmoco;
            inputs[2].value = dados[i].volta;
            inputs[3].value = dados[i].saida;
            inputs[4].value = dados[i].obs || "";
        });
    }

    // Função auxiliar para converter "HH:MM" em minutos
    function timeToMinutes(timeStr) {
        if (!timeStr) return 0;
        const partes = timeStr.split(':');
        return parseInt(partes[0]) * 60 + parseInt(partes[1]);
    }

    // Função auxiliar para formatar horas decimais em "HH:MM"
    function formatTime(decimalHours) {
        const isNegative = decimalHours < 0;
        const absoluteHours = Math.abs(decimalHours);
        const hours = Math.floor(absoluteHours);
        const minutes = Math.round((absoluteHours - hours) * 60);
        const sinal = isNegative ? "-" : "";
        return `${sinal}${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
    }

    // 🔥 CALCULAR HORAS
    function calc() {
        let total = 0, cred = 0, deb = 0;
        const cargaDiaria = parseFloat(cargaEl.value || 8);

        document.querySelectorAll("#tb tr").forEach(r => {
            const inputs = r.querySelectorAll("input");
            const tipo = r.querySelector("select").value;

            let horasTrabalhadas = 0;
            let saldoDoDia = 0;

            const entrada = inputs[0].value;
            const saidaAlmoco = inputs[1].value;
            const volta = inputs[2].value;
            const saida = inputs[3].value;

            // Se tem pelo menos entrada e saída, já calcula.
            if(entrada) {
                let minManha = 0;
                let minTarde = 0;

                if (entrada && saidaAlmoco) {
                    minManha = timeToMinutes(saidaAlmoco) - timeToMinutes(entrada);
                }
                if (volta && saida) {
                    minTarde = timeToMinutes(saida) - timeToMinutes(volta);
                } else if (entrada && saida && !saidaAlmoco && !volta) {
                    // Direto sem almoço
                    minManha = timeToMinutes(saida) - timeToMinutes(entrada);
                }

                horasTrabalhadas = (minManha + minTarde) / 60;
            }

            // Regras de negócio
            if(tipo === "Atestado" || tipo === "Folga/FDS" || tipo === "Feriado") {
                saldoDoDia = horasTrabalhadas; // O que fizer é hora extra
            } else if(tipo === "Falta") {
                saldoDoDia = -cargaDiaria;
            } else {
                // Normal
                if(horasTrabalhadas > 0) {
                    saldoDoDia = horasTrabalhadas - cargaDiaria;
                } else {
                    saldoDoDia = 0; // Se não preencheu, ignora (ou mude para -cargaDiaria se preferir descontar dias não preenchidos)
                }
            }

            total += horasTrabalhadas;
            if(saldoDoDia > 0) cred += saldoDoDia;
            if(saldoDoDia < 0) deb += Math.abs(saldoDoDia);

            r.querySelector(".t").innerText = formatTime(horasTrabalhadas);
            r.querySelector(".s").innerText = formatTime(saldoDoDia);
            
            // Cor do saldo na linha
            r.querySelector(".s").style.color = saldoDoDia > 0 ? "green" : (saldoDoDia < 0 ? "red" : "black");
        });

        // Atualizar Cards
        elH.innerText = formatTime(total);
        elC.innerText = formatTime(cred);
        elD.innerText = formatTime(deb);

        let saldoMes = cred - deb;
        elSM.innerText = formatTime(saldoMes);
        elSM.style.color = saldoMes > 0 ? "green" : (saldoMes < 0 ? "red" : "black");

        elSA.innerText = "00:00"; // Aqui você pode implementar a busca do mês passado depois
        elAC.innerText = formatTime(saldoMes);
    }

    // Ouve qualquer alteração nos inputs e recalcula
    document.addEventListener("input", calc);

    function padrao() { gerar(); }
    function limpar() { if(confirm("Deseja apagar os dados da tela?")) location.reload(); }

</script>
</body>
</html>
