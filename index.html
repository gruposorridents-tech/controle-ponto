<!DOCTYPE html><html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sistema de Controle de Ponto</title><style>
body{margin:0;font-family:Segoe UI;background:#eef2f7;}
.header{background:#1e293b;color:white;padding:15px;text-align:center;}
.container{padding:15px;}
.top-controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
input,select{padding:8px;border:1px solid #ccc;border-radius:5px;}
button{padding:8px 12px;border:none;border-radius:5px;cursor:pointer;background:#2563eb;color:white;}
.cards{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.card{flex:1;background:white;padding:10px;border-radius:6px;text-align:center;border:1px solid #ddd;}
.credito{color:#16a34a;}
.debito{color:#dc2626;}
table{width:100%;border-collapse:collapse;}
th{background:#334155;color:white;padding:8px;}
td{padding:6px;text-align:center;border-bottom:1px solid #ddd;}
.hoje{background:#e0f2fe !important;}
.obs{width:150px;}
</style></head><body><div class="header">Sistema de Controle de Ponto</div><div class="container"><div class="top-controls">
<input id="empresa" placeholder="Empresa"><input id="funcionario" placeholder="Funcionário" list="listaFuncionarios">
<datalist id="listaFuncionarios"></datalist>
<button onclick="adicionarFuncionario()">+ Funcionário</button><select id="mes"></select>
<select id="ano"></select>

<input id="carga" placeholder="Horas/dia (ex: 9)" style="width:130px"><button onclick="carregar()">Carregar</button>
<button onclick="salvar()">Salvar</button>
<button onclick="exportarCSV()">Exportar</button>
<button onclick="padrao()">Padrão</button>
<button onclick="limpar()">Limpar</button>

</div><div class="cards">
<div class="card">Trabalhado<br><b id="h">00:00</b></div>
<div class="card">Crédito<br><b id="c" class="credito">00:00</b></div>
<div class="card">Débito<br><b id="d" class="debito">00:00</b></div>
<div class="card">Saldo Mês<br><b id="sm">00:00</b></div>
<div class="card">Saldo Acum.<br><b id="ac">00:00</b></div>
</div><table>
<thead>
<tr>
<th>Dia</th>
<th>Sem</th>
<th>Tipo</th>
<th>Entrada</th>
<th>Saída Almoço</th>
<th>Volta</th>
<th>Saída</th>
<th>Total</th>
<th>Saldo</th>
<th>Observação</th>
</tr>
</thead>
<tbody id="tb"></tbody>
</table></div><script>

const diasSemana=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const mesEl=document.getElementById("mes");
const anoEl=document.getElementById("ano");
const empresaEl=document.getElementById("empresa");
const funcionarioEl=document.getElementById("funcionario");
const cargaEl=document.getElementById("carga");

for(let m=1;m<=12;m++){mesEl.innerHTML+=<option value="${m}">${String(m).padStart(2,'0')}</option>;}
for(let a=2020;a<=2030;a++){anoEl.innerHTML+=<option value="${a}">${a}</option>;}

function getKey(){return ${empresaEl.value}_${funcionarioEl.value}_${anoEl.value}_${mesEl.value};}

function gerar(){
tb.innerHTML="";
const dias=new Date(anoEl.value,mesEl.value,0).getDate();

for(let i=1;i<=dias;i++){
const d=new Date(anoEl.value,mesEl.value-1,i);

tb.innerHTML+=`
<tr>
<td>${i}</td>
<td>${diasSemana[d.getDay()]}</td>
<td>
<select>
<option>Normal</option>
<option>Feriado</option>
<option>Atestado</option>
<option>Falta</option>
</select>
</td>
<td><input type="time"></td>
<td><input type="time"></td>
<td><input type="time"></td>
<td><input type="time"></td>
<td class="t">0</td>
<td class="s">0</td>
<td><input class="obs"></td>
</tr>`;
}
}

function calc(){
let total=0,cred=0,deb=0;
const carga=parseFloat(cargaEl.value||8);

document.querySelectorAll("#tb tr").forEach(r=>{
const i=r.querySelectorAll("input");
const tipo=r.querySelector("select").value;

let horas=0;

if(i[0].value&&i[3].value){
let e=new Date(1970-01-01T${i[0].value});
let s=new Date(1970-01-01T${i[3].value});
let almoco=0;

if(i[1].value&&i[2].value){
let sa=new Date(1970-01-01T${i[1].value});
let vo=new Date(1970-01-01T${i[2].value});
almoco=(vo-sa)/3600000;
}

horas=((s-e)/3600000)-almoco;
}

let saldo=tipo==="Falta"?-carga:tipo==="Normal"?horas-carga:0;

total+=horas;
if(saldo>0)cred+=saldo;
if(saldo<0)deb+=Math.abs(saldo);

r.querySelector(".t").innerText=horas.toFixed(2);
r.querySelector(".s").innerText=saldo.toFixed(2);
});

h.innerText=total.toFixed(2);
c.innerText=cred.toFixed(2);
d.innerText=deb.toFixed(2);
sm.innerText=(cred-deb).toFixed(2);
ac.innerText=(cred-deb).toFixed(2);
}

document.addEventListener("input",calc);

async function salvar(){
const emp=empresaEl.value.trim();
const func=funcionarioEl.value.trim();
if(!emp||!func)return alert("Preencha dados");

let dados=[];
document.querySelectorAll("#tb tr").forEach(r=>{
const i=r.querySelectorAll("input");
dados.push({
tipo:r.querySelector("select").value,
entrada:i[0].value,
saidaAlmoco:i[1].value,
volta:i[2].value,
saida:i[3].value,
obs:i[4].value
});
});

await db.collection("funcionarios").doc(func).set({nome:func,empresa:emp});

await db.collection("pontos").doc(getKey()).set({dados});
alert("Salvo na nuvem 🚀");
}

async function carregar(){
gerar();
const doc=await db.collection("pontos").doc(getKey()).get();
if(!doc.exists)return;

const dados=doc.data().dados;

document.querySelectorAll("#tb tr").forEach((r,i)=>{
if(!dados[i])return;
const inp=r.querySelectorAll("input");

r.querySelector("select").value=dados[i].tipo;
inp[0].value=dados[i].entrada;
inp[1].value=dados[i].saidaAlmoco;
inp[2].value=dados[i].volta;
inp[3].value=dados[i].saida;
inp[4].value=dados[i].obs;
});

calc();
}

async function carregarFuncionarios(){
const lista=document.getElementById("listaFuncionarios");
lista.innerHTML="";
const snap=await db.collection("funcionarios").get();

snap.forEach(d=>{
const o=document.createElement("option");
o.value=d.data().nome;
lista.appendChild(o);
});
}

async function adicionarFuncionario(){
await db.collection("funcionarios").doc(funcionarioEl.value).set({
nome:funcionarioEl.value,
empresa:empresaEl.value
});
alert("Funcionário adicionado");
carregarFuncionarios();
}

funcionarioEl.addEventListener("change",carregar);
carregarFuncionarios();

function exportarCSV(){alert("export pronto depois");}
function padrao(){gerar();}
function limpar(){location.reload();}

gerar();

</script><!-- Firebase --><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script>

firebase.initializeApp(firebaseConfig);

</script></body>
</html>
