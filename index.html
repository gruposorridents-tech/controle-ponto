<!DOCTYPE html><html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sistema de Controle de Ponto</title><style>
body{margin:0;font-family:Segoe UI;background:#eef2f7;}
.header{background:#1e293b;color:white;padding:15px;text-align:center;}
.container{padding:15px;}
.top-controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;position:relative;}
input,select{padding:8px;border:1px solid #ccc;border-radius:5px;}
button{padding:8px 12px;border:none;border-radius:5px;background:#2563eb;color:white;cursor:pointer;}
.cards{display:flex;gap:10px;margin-bottom:10px;}
.card{flex:1;background:white;padding:10px;border-radius:6px;text-align:center;border:1px solid #ddd;}
.credito{color:#16a34a;}
.debito{color:#dc2626;}
table{width:100%;border-collapse:collapse;}
th{background:#334155;color:white;padding:8px;}
td{padding:6px;text-align:center;border-bottom:1px solid #ddd;}
</style></head><body><div class="header">Sistema de Controle de Ponto</div><div class="container"><div class="top-controls">
<input id="empresa" placeholder="Empresa">
<input id="funcionario" placeholder="Funcionário"><select id="mes"></select>
<select id="ano"></select>

<button onclick="abrirListaFuncionarios()">Funcionários</button>
<button onclick="carregar()">Carregar</button>
<button onclick="salvar()">Salvar</button>

<div id="popupFuncionarios" style="
display:none;
position:absolute;
top:45px;
left:0;
background:white;
border:1px solid #ccc;
border-radius:6px;
padding:10px;
max-height:200px;
overflow:auto;
z-index:999;
width:200px;
"></div>
</div><div class="cards">
<div class="card">Trabalhado<br><b id="h">00:00</b></div>
<div class="card">Crédito<br><b id="c" class="credito">00:00</b></div>
<div class="card">Débito<br><b id="d" class="debito">00:00</b></div>
<div class="card">Saldo Mês<br><b id="sm">00:00</b></div>
</div><table>
<thead>
<tr>
<th>Dia</th>
<th>Entrada</th>
<th>Saída</th>
</tr>
</thead>
<tbody id="tb"></tbody>
</table></div><script>

const mesEl=document.getElementById("mes");
const anoEl=document.getElementById("ano");
const empresaEl=document.getElementById("empresa");
const funcionarioEl=document.getElementById("funcionario");

// 🔥 POPULAR MÊS
for(let m=1;m<=12;m++){
mesEl.innerHTML+=<option value="${m}">${String(m).padStart(2,'0')}</option>;
}

// 🔥 POPULAR ANO
for(let a=2024;a<=2030;a++){
anoEl.innerHTML+=<option value="${a}">${a}</option>;
}

// 🔥 MÊS ATUAL AUTOMÁTICO
const hoje = new Date();
mesEl.value = hoje.getMonth()+1;
anoEl.value = hoje.getFullYear();

function getKey(){
return ${empresaEl.value}_${funcionarioEl.value}_${anoEl.value}_${mesEl.value};
}

function gerar(){
tb.innerHTML="";
const dias = new Date(anoEl.value, mesEl.value, 0).getDate();

for(let i=1;i<=dias;i++){
tb.innerHTML+=`
<tr>
<td>${i}</td>
<td><input type="time"></td>
<td><input type="time"></td>
</tr>`;
}
}

mesEl.onchange=gerar;
anoEl.onchange=gerar;

function calc(){
let total=0;

document.querySelectorAll("#tb tr").forEach(r=>{
const i=r.querySelectorAll("input");

if(i[0].value && i[1].value){
let e=new Date(1970-01-01T${i[0].value});
let s=new Date(1970-01-01T${i[1].value});
total+=(s-e)/3600000;
}
});

h.innerText=total.toFixed(2);
c.innerText="0";
d.innerText="0";
sm.innerText=total.toFixed(2);
}

document.addEventListener("input",calc);

async function salvar(){
const emp=empresaEl.value.trim().toLowerCase();
const func=funcionarioEl.value.trim();

if(!emp || !func){
alert("Preencha empresa e funcionário");
return;
}

let dados=[];

document.querySelectorAll("#tb tr").forEach(r=>{
const i=r.querySelectorAll("input");
dados.push({entrada:i[0].value,saida:i[1].value});
});

// salva funcionário
await db.collection("empresas")
.doc(emp)
.collection("funcionarios")
.doc(func.toLowerCase())
.set({nome:func});

// salva ponto
await db.collection("pontos").doc(getKey()).set({dados});

alert("Salvo na nuvem 🚀");
}

async function carregar(){
gerar();

const doc=await db.collection("pontos").doc(getKey()).get();
if(!doc.exists)return;

const dados=doc.data().dados;

document.querySelectorAll("#tb tr").forEach((r,i)=>{
if(!dados[i])return;

const inp=r.querySelectorAll("input");
inp[0].value=dados[i].entrada;
inp[1].value=dados[i].saida;
});

calc();
}

// 🔥 LISTA FUNCIONÁRIOS
async function abrirListaFuncionarios(){
const emp=empresaEl.value.trim().toLowerCase();

if(!emp){
alert("Digite a empresa primeiro");
return;
}

const popup=document.getElementById("popupFuncionarios");
popup.style.display="block";
popup.innerHTML="Carregando...";

const snap=await db.collection("empresas")
.doc(emp)
.collection("funcionarios")
.get();

popup.innerHTML="";

snap.forEach(doc=>{
const nome=doc.data().nome;

const item=document.createElement("div");
item.innerText=nome;
item.style.padding="8px";
item.style.cursor="pointer";

item.onclick=()=>{
funcionarioEl.value=nome;
popup.style.display="none";
carregar();
};

popup.appendChild(item);
});
}

// fechar popup
document.addEventListener("click",(e)=>{
const popup=document.getElementById("popupFuncionarios");
if(!popup.contains(e.target) && e.target.innerText !== "Funcionários"){
popup.style.display="none";
}
});

gerar();

</script><!-- Firebase --><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script>

appId: "1:405114720617:web:a1dd178eb1592dcda4adf8"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
</script></body>
</html>
