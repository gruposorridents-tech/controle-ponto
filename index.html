<!DOCTYPE html><html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Controle de Ponto</title><style>
body{margin:0;font-family:Segoe UI;background:#eef2f7;}
.header{background:#1e293b;color:white;padding:15px;text-align:center;}
.container{padding:15px;}
.top{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px;position:relative;}
input,select{padding:8px;border:1px solid #ccc;border-radius:5px;}
button{padding:8px 12px;border:none;border-radius:5px;background:#2563eb;color:white;cursor:pointer;}
.card{background:white;padding:10px;border-radius:6px;border:1px solid #ddd;margin-bottom:10px;}
table{width:100%;border-collapse:collapse;}
th{background:#334155;color:white;padding:8px;}
td{padding:6px;text-align:center;border-bottom:1px solid #ddd;}
.popup{position:absolute;top:45px;background:white;border:1px solid #ccc;border-radius:6px;max-height:200px;overflow:auto;display:none;width:200px;}
.popup div{padding:8px;cursor:pointer;}
.popup div:hover{background:#f1f5f9;}
</style></head><body><div class="header">Sistema de Controle de Ponto</div><div class="container"><div class="top">
<input id="empresa" placeholder="Empresa">
<input id="funcionario" placeholder="Funcionário"><select id="mes"></select>
<select id="ano"></select>

<button onclick="abrirFuncionarios()">Funcionários</button>
<button onclick="carregar()">Carregar</button>
<button onclick="salvar()">Salvar</button>

<div id="popup" class="popup"></div>
</div><div class="card">
Total Trabalhado: <b id="total">0</b> horas
</div><table>
<thead>
<tr>
<th>Dia</th>
<th>Entrada</th>
<th>Saída</th>
</tr>
</thead>
<tbody id="tb"></tbody>
</table></div><!-- 🔥 FIREBASE PRIMEIRO --><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script>
const firebaseConfig = {
apiKey: "AIzaSyAEq2fa6m9px15IGR6vUPUQ_UnFhkwlPc",
authDomain: "controle-ponto-1fb12.firebaseapp.com",
projectId: "controle-ponto-1fb12"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ELEMENTOS
const empresa = document.getElementById("empresa");
const funcionario = document.getElementById("funcionario");
const mes = document.getElementById("mes");
const ano = document.getElementById("ano");
const tb = document.getElementById("tb");
const totalEl = document.getElementById("total");

// MÊS/ANO
for(let m=1;m<=12;m++){
mes.innerHTML+=<option value="${m}">${String(m).padStart(2,'0')}</option>;
}
for(let a=2024;a<=2030;a++){
ano.innerHTML+=<option value="${a}">${a}</option>;
}

const hoje=new Date();
mes.value=hoje.getMonth()+1;
ano.value=hoje.getFullYear();

// GERAR DIAS
function gerar(){
tb.innerHTML="";
const dias=new Date(ano.value,mes.value,0).getDate();

for(let i=1;i<=dias;i++){
const tr=document.createElement("tr");
tr.innerHTML=`
<td>${i}</td>
<td><input type="time"></td>
<td><input type="time"></td>
`;
tb.appendChild(tr);
}
}
mes.onchange=gerar;
ano.onchange=gerar;
gerar();

// CALCULAR
function calcular(){
let total=0;

document.querySelectorAll("#tb tr").forEach(r=>{
const i=r.querySelectorAll("input");

if(i[0].value && i[1].value){
let e=new Date(1970-01-01T${i[0].value});
let s=new Date(1970-01-01T${i[1].value});
total+=(s-e)/3600000;
}
});

totalEl.innerText=total.toFixed(2);
}
document.addEventListener("input",calcular);

// CHAVE
function chave(){
return ${empresa.value}_${funcionario.value}_${ano.value}_${mes.value};
}

// SALVAR
async function salvar(){
if(!empresa.value || !funcionario.value){
alert("Preencha empresa e funcionário");
return;
}

let dados=[];

document.querySelectorAll("#tb tr").forEach(r=>{
const i=r.querySelectorAll("input");
dados.push({entrada:i[0].value,saida:i[1].value});
});

// salva funcionário
await db.collection("empresas")
.doc(empresa.value)
.collection("funcionarios")
.doc(funcionario.value)
.set({nome:funcionario.value});

// salva ponto
await db.collection("pontos").doc(chave()).set({dados});

alert("Salvo com sucesso 🚀");
}

// CARREGAR
async function carregar(){
gerar();

const doc=await db.collection("pontos").doc(chave()).get();
if(!doc.exists)return;

const dados=doc.data().dados;

document.querySelectorAll("#tb tr").forEach((r,i)=>{
if(!dados[i])return;

const inputs=r.querySelectorAll("input");
inputs[0].value=dados[i].entrada;
inputs[1].value=dados[i].saida;
});

calcular();
}

// FUNCIONÁRIOS
async function abrirFuncionarios(){
if(!empresa.value){
alert("Digite a empresa");
return;
}

const popup=document.getElementById("popup");
popup.style.display="block";
popup.innerHTML="Carregando...";

const snap=await db.collection("empresas")
.doc(empresa.value)
.collection("funcionarios")
.get();

popup.innerHTML="";

snap.forEach(doc=>{
const nome=doc.data().nome;

const div=document.createElement("div");
div.innerText=nome;

div.onclick=()=>{
funcionario.value=nome;
popup.style.display="none";
carregar();
};

popup.appendChild(div);
});
}

// fechar popup
document.addEventListener("click",(e)=>{
const popup=document.getElementById("popup");
if(!popup.contains(e.target) && e.target.innerText!=="Funcionários"){
popup.style.display="none";
}
});
</script></body>
</html>
