<!DOCTYPE html><html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Controle de Ponto</title><style>
body{margin:0;font-family:Segoe UI;background:#eef2f7;}
.header{background:#1e293b;color:white;padding:15px;text-align:center;}
.container{padding:15px;}
.top-controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
input,select{padding:8px;border:1px solid #ccc;border-radius:5px;}
button{padding:8px 12px;border:none;border-radius:5px;background:#2563eb;color:white;cursor:pointer;}
.cards{display:flex;gap:10px;margin-bottom:10px;}
.card{flex:1;background:white;padding:10px;border-radius:6px;text-align:center;border:1px solid #ddd;}
table{width:100%;border-collapse:collapse;}
th{background:#334155;color:white;padding:8px;}
td{padding:6px;text-align:center;border-bottom:1px solid #ddd;}
</style></head><body><div class="header">Sistema de Controle de Ponto</div><div class="container"><div class="top-controls">
<input id="empresa" placeholder="Empresa"><input id="funcionario" placeholder="Funcionário" list="listaFuncionarios">
<datalist id="listaFuncionarios"></datalist>
<button onclick="adicionarFuncionario()">+ Funcionário</button><input id="buscaFuncionario" placeholder="Buscar funcionário..." oninput="filtrarFuncionarios()">
<div id="listaBusca"></div><select id="mes"></select>
<select id="ano"></select>

<button onclick="carregar()">Carregar</button>
<button onclick="salvar()">Salvar</button>

</div><div class="cards">
<div class="card">Trabalhado<br><b id="h">0</b></div>
<div class="card">Saldo<br><b id="sm">0</b></div>
</div><table>
<thead>
<tr>
<th>Dia</th>
<th>Entrada</th>
<th>Saída</th>
</tr>
</thead>
<tbody id="tb"></tbody>
</table></div><script>

const mesEl=document.getElementById("mes");
const anoEl=document.getElementById("ano");
const empresaEl=document.getElementById("empresa");
const funcionarioEl=document.getElementById("funcionario");

for(let m=1;m<=12;m++){mesEl.innerHTML+=<option value="${m}">${m}</option>;}
for(let a=2024;a<=2030;a++){anoEl.innerHTML+=<option value="${a}">${a}</option>;}

function getKey(){
return ${empresaEl.value}_${funcionarioEl.value}_${anoEl.value}_${mesEl.value};
}

function gerar(){
tb.innerHTML="";
for(let i=1;i<=30;i++){
tb.innerHTML+=`
<tr>
<td>${i}</td>
<td><input type="time"></td>
<td><input type="time"></td>
</tr>`;
}
}

function calc(){
let total=0;

document.querySelectorAll("#tb tr").forEach(r=>{
const i=r.querySelectorAll("input");

if(i[0].value && i[1].value){
let e=new Date(1970-01-01T${i[0].value});
let s=new Date(1970-01-01T${i[1].value});
total+=(s-e)/3600000;
}
});

h.innerText=total.toFixed(2);
sm.innerText=total.toFixed(2);
}

document.addEventListener("input",calc);

async function salvar(){
let dados=[];

document.querySelectorAll("#tb tr").forEach(r=>{
const i=r.querySelectorAll("input");
dados.push({entrada:i[0].value,saida:i[1].value});
});

await db.collection("pontos").doc(getKey()).set({dados});
alert("Salvo");
}

async function carregar(){
gerar();
const doc=await db.collection("pontos").doc(getKey()).get();
if(!doc.exists)return;

const dados=doc.data().dados;

document.querySelectorAll("#tb tr").forEach((r,i)=>{
if(!dados[i])return;
const inp=r.querySelectorAll("input");
inp[0].value=dados[i].entrada;
inp[1].value=dados[i].saida;
});

calc();
}

// 🔥 FUNCIONÁRIOS POR EMPRESA
let funcionariosCache=[];

async function carregarFuncionarios(){
const emp=empresaEl.value;
if(!emp)return;

funcionariosCache=[];

const snap=await db.collection("empresas").doc(emp).collection("funcionarios").get();

snap.forEach(d=>{
funcionariosCache.push(d.data().nome);
});

renderLista(funcionariosCache);
}

function renderLista(lista){
const div=document.getElementById("listaBusca");
div.innerHTML="";

lista.forEach(nome=>{
const item=document.createElement("div");
item.innerText=nome;
item.onclick=()=>{
funcionarioEl.value=nome;
carregar();
div.innerHTML="";
};
div.appendChild(item);
});
}

function filtrarFuncionarios(){
const busca=document.getElementById("buscaFuncionario").value.toLowerCase();
renderLista(funcionariosCache.filter(f=>f.toLowerCase().includes(busca)));
}

async function adicionarFuncionario(){
await db.collection("empresas")
.doc(empresaEl.value)
.collection("funcionarios")
.doc(funcionarioEl.value)
.set({nome:funcionarioEl.value});

alert("Funcionário adicionado");
carregarFuncionarios();
}

empresaEl.addEventListener("change",carregarFuncionarios);

gerar();

</script><!-- Firebase --><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script>

</html>
